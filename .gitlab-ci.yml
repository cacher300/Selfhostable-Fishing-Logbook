stages:
  - validate
  - smoke_test
  - docker_check
  - deploy

default:
  tags:
    - docker

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"
  HOST: "127.0.0.1"
  PORT: "8080"
  SECRET_KEY: "ci-only-session-signing-key"

test_python_app:
  stage: validate
  image: python:3.12-slim
  script:
    - python --version
    - pip install -r requirements.txt
    - python -m compileall server.py backend
    - python -m pytest tests -v
    - test -f server.py
    - test -f requirements.txt
    - test -f index.html

test_javascript:
  stage: validate
  image: node:22-alpine
  script:
    - node --version
    - node --test tests/*.test.js

smoke_test_flask_server:
  stage: smoke_test
  image: python:3.12-slim
  needs:
    - test_python_app
  script:
    - pip install -r requirements.txt
    - mkdir -p data/uploads backups
    - python server.py &
    - SERVER_PID=$!
    - sleep 5
    - >-
      python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080', timeout=10); print('Status:', r.status); exit(0 if r.status < 400 else 1)"
    - kill "$SERVER_PID"

docker_compose_config_check:
  stage: docker_check
  image: docker:27
  script:
    - docker compose version
    - docker compose config
  rules:
    - exists:
        - docker-compose.yml
        - compose.yml

deploy_production:
  stage: deploy
  image: alpine:3.20
  resource_group: fish-production
  needs:
    - job: test_python_app
    - job: test_javascript
    - job: docker_compose_config_check
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
    url: https://fish.zionkoudijs.com
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - |
      : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY must be configured as a protected CI/CD variable}"
      if [ -f "$DEPLOY_SSH_KEY" ]; then
        cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
      else
        printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
      fi
      chmod 600 ~/.ssh/id_ed25519
      ssh-keygen -lf ~/.ssh/id_ed25519
    - |
      : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS must be configured as a protected CI/CD variable}"
      if [ -f "$DEPLOY_KNOWN_HOSTS" ]; then
        cp "$DEPLOY_KNOWN_HOSTS" ~/.ssh/known_hosts
      else
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      fi
      chmod 644 ~/.ssh/known_hosts
      test -s ~/.ssh/known_hosts
      wc -l ~/.ssh/known_hosts
  script:
    - |
      : "${DEPLOY_HOST:?DEPLOY_HOST must be configured}"
      : "${DEPLOY_USER:?DEPLOY_USER must be configured}"
      : "${DEPLOY_PATH:?DEPLOY_PATH must be configured}"
      : "${DEPLOY_DATA_PATH:?DEPLOY_DATA_PATH must be configured}"
      ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
        "$DEPLOY_USER@$DEPLOY_HOST" /bin/sh -s -- \
        "$DEPLOY_PATH" "$DEPLOY_DATA_PATH" "$CI_DEFAULT_BRANCH" <<'REMOTE_SCRIPT'
      set -eu
      DEPLOY_PATH=$1
      DEPLOY_DATA_PATH=$2
      CI_DEFAULT_BRANCH=$3
      cd "$DEPLOY_PATH"
      git fetch --prune origin
      git reset --hard "origin/$CI_DEFAULT_BRANCH"
      mkdir -p "$DEPLOY_DATA_PATH/uploads"
      FISH_DATA_DIR="$DEPLOY_DATA_PATH" docker compose up -d --build --remove-orphans --wait
      REMOTE_SCRIPT
