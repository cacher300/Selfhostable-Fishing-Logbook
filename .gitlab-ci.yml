stages:
  - validate
  - build
  - smoke_test
  - docker_check

default:
  tags:
    - docker

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  PYTHONUNBUFFERED: "1"
  HOST: "127.0.0.1"
  PORT: "8080"
  SECRET_KEY: "ci-only-session-signing-key"

test_python_app:
  stage: validate
  image: python:3.13-slim
  script:
    - python --version
    - pip install -r requirements-dev.txt
    - python -m compileall -q server.py backend scripts
    - python -m pytest tests -v

test_javascript:
  stage: validate
  image: node:22
  script:
    - node --version
    - npm ci --no-audit --no-fund
    - npm run schema:check:desktop
    - npm test

cloud_worker_tests:
  stage: validate
  image: node:22
  # The Cloudflare Worker is not actively developed; keep its own tests
  # visible without blocking web-client pipelines.
  allow_failure: true
  script:
    - cd cloud/worker
    - npm ci --no-audit --no-fund
    - npm test

build_frontend:
  stage: build
  image: python:3.13-slim
  needs: []
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gnupg
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y --no-install-recommends nodejs
  script:
    - npm ci --no-audit --no-fund
    - npm run build
    - pip install -r requirements.txt
    - python scripts/build-standalone.py
    - test -f static/dist/app.js
    - test -f static/dist/manifest.json
    - test -f standalone.html
  artifacts:
    paths:
      - static/dist/
      - standalone.html
    expire_in: 1 day

browser_smoke_tests:
  stage: smoke_test
  image: python:3.13
  needs:
    - build_frontend
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gnupg
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y --no-install-recommends nodejs
  script:
    - python -m venv .venv
    - .venv/bin/pip install -r requirements.txt
    - npm ci --no-audit --no-fund
    - npx playwright install --with-deps chromium
    - CI=1 npm run test:e2e
  artifacts:
    when: on_failure
    paths:
      - /tmp/fishing-logbook-playwright/
    expire_in: 3 days

docker_compose_config_check:
  stage: docker_check
  image: docker:27
  script:
    - docker compose version
    - docker compose config
  rules:
    - exists:
        - docker-compose.yml
        - compose.yml
