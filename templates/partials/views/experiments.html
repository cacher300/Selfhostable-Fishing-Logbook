<section id="experimentsPanel" class="hidden experiments-panel" aria-label="Experiments">
  <p class="experiment-intro">Create an experiment with variants such as Silver and Chartreuse. Select the experiments you’re running in Trip Basics, then pick a variant for each participating setup line. Compare rod-hours, landed fish and missed fish across variants. Hourly rates use setups with both a start and an end time.</p>
  <div class="experiments-toolbar">
    <button class="button primary" type="button" data-experiment-action="new">New experiment</button>
  </div>
  <p id="experimentFeedback" role="status" hidden></p>
  <form id="experimentEditor" class="experiments-editor" hidden></form>
  <div id="experimentResults" class="experiments-list"></div>
</section>
