<section class="checklists-page hidden" id="checklistsPanel" aria-label="Preparation checklists">
  <header class="checklists-header">
    <div>
      <h3>Checklists</h3>
      <p>Create reusable lists for launch day, safety gear, tackle, and anything else you want to remember.</p>
    </div>
    <button class="button primary" id="newChecklistButton" type="button">New Checklist</button>
  </header>
  <div class="checklist-list" id="checklistList"></div>
  <div class="empty-state hidden" id="checklistsEmpty">
    <h3>No checklists yet</h3>
    <button class="button primary" id="emptyNewChecklistButton" type="button">Create Checklist</button>
  </div>
</section>
