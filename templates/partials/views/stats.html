<section class="stats-page hidden workbench" id="statsPanel" aria-label="Fishing performance statistics">
  <header class="work-heading">
    <div><h2>Fishing performance</h2><p id="statsActiveScope" aria-live="polite">All time · All methods</p></div>
    <div class="work-actions">
      <button class="button secondary" id="bestsViewButton" type="button">Personal Bests</button>
      <button class="button secondary" id="leaderboardViewButton" type="button">Leaderboard</button>
    </div>
  </header>
  <section class="work-scope" aria-label="Scope of statistics">
    <div class="work-fields">
      <label>Date range<select id="statsDateFilter"></select></label>
      <label>Fishing method<select id="statsMethodFilter"></select></label>
      <label>Waterbody<select id="statsLocationFilter"></select></label>
      <button type="button" class="button secondary" id="workReset">Reset filters</button>
    </div>
    <div id="workCustomDates" hidden>
      <div class="work-fields"><label>Start date<input id="workDateFrom" type="date" aria-describedby="workDateHint"></label>
        <label>End date<input id="workDateTo" type="date" aria-describedby="workDateHint"></label></div>
      <p id="workDateHint" aria-live="polite"></p>
    </div>
    <details><summary>More filters</summary><div class="work-fields">
      <label>Trip target<select id="workTarget"></select></label><label>Catch species<select id="statsSpeciesFilter"></select></label>
      <label>Angler<select id="statsPersonFilter"></select></label><label>Launch<select id="statsLaunchFilter"></select></label>
      <label>Lure<select id="statsLureFilter"></select></label><label>Flasher<select id="statsFlasherFilter"></select></label>
      <label>Water clarity<select id="statsWaterClarityFilter"></select></label><label>Weather tag<select id="statsWeatherFilter"></select></label>
      <label>Month<select id="statsMonthFilter"></select></label><label>Trip rating<select id="statsRatingFilter"></select></label>
    </div></details>
  </section>
  <div id="statsMetricGrid" class="metric-grid"></div>
  <section class="stats-activity-card" aria-labelledby="statsActivityTitle">
    <div class="stats-activity-card-header"><div><h3 id="statsActivityTitle">Fishing heatmap</h3><p id="statsActivitySummary" aria-live="polite"></p></div>
      <div class="work-actions" id="workHeatModes" role="group" aria-label="Heatmap measure"></div>
    </div>
    <div id="statsActivityHeatmap"></div>
  </section>
  <details id="basicStatsPanel" class="stats-disclosure">
    <summary><h3>Basic Stats</h3></summary>
    <div class="stats-disclosure-content">
      <div id="basicStatsHighlights" class="metric-grid"></div>
      <div id="basicStatsBreakdowns" class="basic-breakdowns"></div>
    </div>
  </details>
  <details id="advancedStatsPanel" class="stats-disclosure">
  <summary><h3 id="workTitle">Advanced Stats</h3></summary>
  <section class="work-comparison" aria-labelledby="workTitle">
    <div class="work-tools">
      <div class="work-topics" id="workTopics" aria-label="Report topics"></div>
      <label class="work-check advanced-hide-empty"><input type="checkbox" id="workHideEmpty">Hide zero &amp; empty results</label>
      <div class="work-fields">
        <div class="work-parameter-field">
          <label for="statsCompareBySelect">Compare</label>
          <select id="statsCompareBySelect" aria-describedby="statsCompareByHelp"></select>
          <small class="work-parameter-help" id="statsCompareByHelp">Choose the item or category to compare.</small>
        </div>
        <div class="work-parameter-field" id="workSplitField">
          <label for="statsCompareSplitSelect">Split by</label>
          <select id="statsCompareSplitSelect" aria-describedby="statsCompareSplitHelp"></select>
          <small class="work-parameter-help" id="statsCompareSplitHelp">Optionally break results into subgroups.</small>
        </div>
        <div class="work-parameter-field">
          <label for="statsCompareMetricSelect">Measure</label>
          <select id="statsCompareMetricSelect" aria-describedby="statsCompareMetricHelp"></select>
          <small class="work-parameter-help" id="statsCompareMetricHelp">Choose the statistic shown for each group.</small>
        </div>
        <label id="workSizeField">Minimum fish length <span id="workSizeUnit"></span><input id="workSize" type="number" min="0" step="any" placeholder="Enter size"></label>
      </div>
      <details id="workOptions"><summary>Head-to-head &amp; sample limits</summary><div class="work-fields">
        <label id="workAField">First group<select id="workA"></select></label><label id="workBField">Second group<select id="workB"></select></label>
        <label>Min trips<input id="statsMinTripsInput" type="number" min="0" step="1" value="0"></label>
        <label id="workMinHoursField">Min hours<input id="statsMinHoursInput" type="number" min="0" step="0.25" value="0"></label>
        <label class="work-check" id="workMatchField"><input type="checkbox" id="workMatched">Only when both setups were fishing</label>
      </div></details>
    </div>
    <div class="work-result" aria-labelledby="workReportTitle">
      <div class="work-heading"><div><h4 id="workReportTitle"></h4><p id="workReportCount" aria-live="polite"></p></div><div class="work-actions" id="workViews"></div></div>
      <p class="work-note" id="statsCompareNote"></p>
      <div id="comparisonBuilderTable"></div>
      <div id="workSources" aria-live="polite"></div>
    </div>
  </section>
  </details>
</section>
