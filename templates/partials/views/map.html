<section class="map-page hidden" id="mapPanel" aria-label="Fish catch map">
          <div class="map-header">
            <div id="mapLegend" class="map-header-legend"></div>
            <div class="map-tools">
              <label>
                <span>Species</span>
                <select id="mapSpeciesFilter"></select>
              </label>
              <label>
                <span>Lake</span>
                <select id="mapLakeFilter"></select>
              </label>
              <label>
                <span>Method</span>
                <select id="mapMethodFilter"></select>
              </label>
              <label id="mapYearFilterControl">
                <span>Year</span>
                <select id="mapYearFilter"></select>
              </label>
              <details class="map-more-filters" name="map-toolbar-menu">
                <summary>Filters</summary>
                <div class="map-more-filters-panel">
                  <label class="inline-toggle map-media-toggle">
                    <input id="mapTripPhotosToggle" type="checkbox" />
                    <span>Show photos</span>
                  </label>
                  <label class="inline-toggle map-spots-toggle">
                    <input id="mapSpotsToggle" type="checkbox" checked />
                    <span>Show spots</span>
                  </label>
                  <label class="inline-toggle map-drifts-toggle">
                    <input id="mapDriftsToggle" type="checkbox" />
                    <span>Show drifts</span>
                  </label>
                  <label class="inline-toggle map-direction-toggle">
                    <input id="mapDirectionArrowsToggle" type="checkbox" checked />
                    <span>Direction arrows</span>
                  </label>
                  <label>
                    <span>Direction</span>
                    <select id="mapDirectionFilter"></select>
                  </label>
                  <label>
                    <span>Angler</span>
                    <select id="mapAnglerFilter"></select>
                  </label>
                  <label class="inline-toggle map-year-filter-toggle">
                    <input id="mapHideYearFilterToggle" type="checkbox" checked />
                    <span>Hide year filtering</span>
                  </label>
                  <button id="mapClearFilters" class="map-clear-filters" type="button">Clear filters</button>
                </div>
              </details>
              <details class="map-layers-menu" name="map-toolbar-menu">
                <summary>Layers</summary>
                <div class="map-layers-menu-panel">
                  <div id="greatLakesConditions"></div>
                  <div class="map-display-row">
                    <label class="map-display-select">
                      <span>Map styles</span>
                      <select id="mapBasemap" aria-label="Map styles">
                        <option value="standard">Standard</option>
                        <option value="dark">Dark</option>
                        <option value="minimal">Minimal</option>
                        <option value="satellite">Satellite</option>
                      </select>
                    </label>
                    <label class="map-display-select">
                      <span>Units</span>
                      <select id="mapUnits" aria-label="Units">
                        <option value="imperial" selected>Imperial</option>
                        <option value="metric">Metric</option>
                        <option value="nautical">Nautical</option>
                      </select>
                    </label>
                  </div>
                  <div class="map-layer-options-grid">
                    <div class="map-layer-option">
                      <label class="inline-toggle map-chart-toggle">
                        <input id="mapDepthContoursToggle" type="checkbox" />
                        <span>Show depth contours</span>
                      </label>
                      <small id="mapDepthContoursStatus" class="map-bathymetry-status" role="status" aria-live="polite"></small>
                    </div>
                    <div class="map-layer-option">
                      <label class="inline-toggle map-chart-toggle">
                        <input id="mapBathymetryToggle" type="checkbox" />
                        <span>Show depth shading</span>
                      </label>
                      <small id="mapBathymetryStatus" class="map-bathymetry-status" role="status" aria-live="polite"></small>
                    </div>
                    <div class="map-layer-option">
                      <label class="inline-toggle map-chart-toggle">
                        <input id="mapBathymetryV2Toggle" type="checkbox" />
                        <span>Depth shading version 2</span>
                      </label>
                      <div id="mapBathymetryV2Legend" class="map-depth-v2-legend hidden" role="img" aria-label="Depth scale">
                        <span data-depth-min></span><span class="map-depth-v2-gradient"></span><span data-depth-max></span>
                      </div>
                      <small id="mapBathymetryV2Status" class="map-bathymetry-status" role="status" aria-live="polite"></small>
                    </div>
                    <div class="map-layer-option map-layer-option-satellite">
                      <label class="inline-toggle map-chart-toggle">
                        <input id="mapSatellitePhotoToggle" type="checkbox" />
                        <span>NOAA satellite photo</span>
                      </label>
                      <div id="mapSatellitePhotoOptions" class="map-satellite-photo-options" hidden>
                        <label class="map-display-select">
                          <span>Satellite pass</span>
                          <select id="mapSatellitePhotoPass" aria-label="Satellite pass" disabled></select>
                        </label>
                        <label class="map-satellite-opacity">
                          <span>Photo opacity <output id="mapSatellitePhotoOpacityLabel">70%</output></span>
                          <input id="mapSatellitePhotoOpacity" type="range" min="20" max="100" step="5" value="70" aria-label="Photo opacity" />
                        </label>
                        <small id="mapSatellitePhotoStatus" class="map-bathymetry-status" role="status" aria-live="polite"></small>
                      </div>
                    </div>
                    <div class="map-layer-option">
                      <label class="inline-toggle map-chart-toggle">
                        <input id="mapWebcamsToggle" type="checkbox" />
                        <span>Webcams</span>
                      </label>
                    </div>
                    <div class="map-layer-option">
                      <label class="inline-toggle map-chart-toggle">
                        <input id="mapNoaaChartsToggle" type="checkbox" />
                        <span>NOAA charts</span>
                      </label>
                    </div>
                  </div>
                  <fieldset class="great-lakes-points-options" aria-label="Data point layers">
                    <label class="inline-toggle map-chart-toggle"><input type="checkbox" data-gl-stations /> <span>Buoys</span></label>
                    <label class="inline-toggle map-chart-toggle"><input type="checkbox" data-gl-model-points /> <span>NOAA Model calculation points</span></label>
                    <p data-gl-points-status role="status" aria-live="polite"></p>
                  </fieldset>
                </div>
              </details>
            </div>
          </div>
          <div id="fishMap" class="fish-map"></div>
        </section>
