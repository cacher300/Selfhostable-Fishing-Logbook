<section class="map-page hidden" id="mapPanel" aria-label="Fish catch map">
          <div class="map-header">
            <div id="mapLegend" class="map-header-legend"></div>
            <div class="map-tools">
              <label>
                <span>Species</span>
                <select id="mapSpeciesFilter"></select>
              </label>
              <label>
                <span>Lake</span>
                <select id="mapLakeFilter"></select>
              </label>
              <label>
                <span>Method</span>
                <select id="mapMethodFilter"></select>
              </label>
              <label id="mapYearFilterControl">
                <span>Year</span>
                <select id="mapYearFilter"></select>
              </label>
              <details class="map-more-filters" name="map-toolbar-menu">
                <summary>Filters</summary>
                <div class="map-more-filters-panel">
                  <label class="inline-toggle map-media-toggle">
                    <input id="mapTripPhotosToggle" type="checkbox" />
                    <span>Show photos</span>
                  </label>
                  <label class="inline-toggle map-spots-toggle">
                    <input id="mapSpotsToggle" type="checkbox" checked />
                    <span>Show spots</span>
                  </label>
                  <label class="inline-toggle map-direction-toggle">
                    <input id="mapDirectionArrowsToggle" type="checkbox" checked />
                    <span>Direction arrows</span>
                  </label>
                  <label>
                    <span>Direction</span>
                    <select id="mapDirectionFilter"></select>
                  </label>
                  <label>
                    <span>Angler</span>
                    <select id="mapAnglerFilter"></select>
                  </label>
                  <label class="inline-toggle map-year-filter-toggle">
                    <input id="mapHideYearFilterToggle" type="checkbox" checked />
                    <span>Hide year filtering</span>
                  </label>
                  <button id="mapClearFilters" class="map-clear-filters" type="button">Clear filters</button>
                </div>
              </details>
              <details class="map-layers-menu" name="map-toolbar-menu">
                <summary>Layers</summary>
                <div class="map-layers-menu-panel">
                  <div id="greatLakesConditions"></div>
                  <div class="map-display-row">
                    <label class="map-display-select">
                      <span>Map styles</span>
                      <select id="mapBasemap" aria-label="Map styles">
                        <option value="standard">Standard</option>
                        <option value="dark">Dark</option>
                        <option value="minimal">Minimal</option>
                      </select>
                    </label>
                    <label class="map-display-select">
                      <span>Units</span>
                      <select id="mapUnits" aria-label="Units">
                        <option value="imperial" selected>Imperial</option>
                        <option value="metric">Metric</option>
                        <option value="nautical">Nautical</option>
                      </select>
                    </label>
                  </div>
                  <label class="inline-toggle map-chart-toggle">
                    <input id="mapDepthContoursToggle" type="checkbox" />
                    <span>Show depth contours</span>
                  </label>
                  <small id="mapDepthContoursStatus" class="map-bathymetry-status" role="status" aria-live="polite"></small>
                  <label class="inline-toggle map-chart-toggle">
                    <input id="mapBathymetryToggle" type="checkbox" />
                    <span>Show depth shading</span>
                  </label>
                  <small id="mapBathymetryStatus" class="map-bathymetry-status" role="status" aria-live="polite"></small>
                  <fieldset class="great-lakes-points-options">
                    <legend>Data points</legend>
                    <label><input type="checkbox" data-gl-stations /> <span>Measurement stations</span></label>
                    <label><input type="checkbox" data-gl-model-points /> <span>NOAA Model calculation points</span></label>
                    <p data-gl-points-status role="status" aria-live="polite"></p>
                  </fieldset>
                  <label class="inline-toggle map-chart-toggle">
                    <input id="mapNoaaChartsToggle" type="checkbox" checked />
                    <span>NOAA charts</span>
                  </label>
                </div>
              </details>
            </div>
          </div>
          <div id="fishMap" class="fish-map"></div>
        </section>
