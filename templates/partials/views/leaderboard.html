<section class="stats-page leaderboard-page hidden" id="leaderboardPanel" aria-label="Leaderboard">
          <section class="stats-leaderboard" aria-label="Leaderboard rankings">
            <div class="leaderboard-filters" role="group" aria-label="Leaderboard filters">
              <label class="leaderboard-filter" for="leaderboardDateFilter">
                <span>Date range</span>
                <select id="leaderboardDateFilter" aria-label="Filter leaderboard by date range"></select>
              </label>
              <label class="leaderboard-filter" for="leaderboardMethodFilter">
                <span>Fishing method</span>
                <select id="leaderboardMethodFilter" aria-label="Filter leaderboard by fishing method"></select>
              </label>
              <label class="leaderboard-filter" for="leaderboardLocationFilter">
                <span>Waterbody</span>
                <select id="leaderboardLocationFilter" aria-label="Filter leaderboard by waterbody"></select>
              </label>
              <label class="leaderboard-filter" for="leaderboardSpeciesFilter">
                <span>Catch species</span>
                <select id="leaderboardSpeciesFilter" aria-label="Filter leaderboard by catch species"></select>
              </label>
              <label class="leaderboard-filter" for="leaderboardPersonFilter">
                <span>Person</span>
                <select id="leaderboardPersonFilter" aria-label="Filter leaderboard by person"></select>
              </label>
              <div class="leaderboard-custom-dates" id="leaderboardCustomDates" hidden>
                <label class="leaderboard-filter" for="leaderboardDateFrom">
                  <span>From</span>
                  <input id="leaderboardDateFrom" type="date" aria-describedby="leaderboardDateHint" />
                </label>
                <label class="leaderboard-filter" for="leaderboardDateTo">
                  <span>To</span>
                  <input id="leaderboardDateTo" type="date" aria-describedby="leaderboardDateHint" />
                </label>
                <p id="leaderboardDateHint" aria-live="polite"></p>
              </div>
            </div>
            <div class="stats-leaderboard-grid">
              <details class="stats-leaderboard-board" open>
                <summary><h3>Rod Leaderboard</h3></summary>
                <div class="leaderboard-list" id="statsRodLeaderboard"></div>
              </details>
              <details class="stats-leaderboard-board" open>
                <summary><h3>Reel Leaderboard</h3></summary>
                <div class="leaderboard-list" id="statsReelLeaderboard"></div>
              </details>
              <details class="stats-leaderboard-board" open>
                <summary><h3>Combo Leaderboard</h3></summary>
                <div class="leaderboard-list" id="statsComboLeaderboard"></div>
              </details>
              <details class="stats-leaderboard-board" open>
                <summary><h3>Lure Leaderboard</h3></summary>
                <div class="leaderboard-list" id="statsLureLeaderboard"></div>
              </details>
              <details class="stats-leaderboard-board" open>
                <summary><h3>Flasher Leaderboard</h3></summary>
                <div class="leaderboard-list" id="statsFlasherLeaderboard"></div>
              </details>
              <details class="stats-leaderboard-board" open>
                <summary><h3>People Leaderboard</h3></summary>
                <div class="leaderboard-list" id="statsAnglerLeaderboard"></div>
              </details>
            </div>
          </section>
        </section>
