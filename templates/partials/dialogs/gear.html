<dialog id="reelDialog" class="dialog">
      <form id="reelForm" method="dialog">
        <div class="dialog-header">
          <div>
            <h2>Add Reel</h2>
          </div>
          <button class="icon-button" value="cancel" type="button" data-close-dialog aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg></button>
        </div>
        <input type="hidden" id="editingReelId" />
        <div class="form-grid">
          <label><span>Reel short name</span><input id="reelShortName" type="text" placeholder="BC - Abu Pro Max LP" /></label>
          <label><span>Style</span><select id="reelStyle"></select></label>
          <label><span>Brand</span><input id="reelBrand" type="text" placeholder="Abu Garcia" /></label>
          <label><span>Name / model</span><input id="reelName" type="text" placeholder="Pro Max" /></label>
          <label><span>Size</span><input id="reelSize" type="text" placeholder="LP, 3000, 4000" /></label>
          <label><span>Weight</span><input id="reelWeight" type="text" placeholder="7.3 oz" /></label>
          <label><span>Gear ratio</span><input id="reelGearRatio" type="text" placeholder="7.1:1" /></label>
          <label><span>Retrieve rate</span><input id="reelRetrieveRate" type="text" placeholder="29 in" /></label>
          <label><span data-unit-label="fishWeight" data-unit-label-text="Max drag">Max drag</span><input id="reelMaxDrag" type="text" placeholder="18 lb" /></label>
          <label><span>Mono capacity</span><input id="reelMonoCapacity" type="text" placeholder="145/12" /></label>
          <label><span>Braid capacity</span><input id="reelBraidCapacity" type="text" placeholder="140/30" /></label>
          <label><span>Purchase amount</span><input id="reelPurchaseAmount" type="text" placeholder="89.99" /></label>
          <label><span>Date bought</span><input id="reelDateBought" type="date" /></label>
          <label><span>Quantity owned</span><input id="reelQuantityAvailable" type="number" min="0" step="1" placeholder="1" /></label>
          <label><span>Reel photos</span><input id="reelImage" type="file" accept="image/*,.heic,.heif,video/*" multiple /></label>
          <button class="button secondary align-end" type="button" data-use-photo-queue="reels">Use Queue</button>
          <div id="reelQueuedImage" class="queued-gear-image hidden"></div>
          <div id="reelExistingPhotos" class="gear-editor-photos hidden"></div>
          <div class="row-section-title">Line Tracker</div>
          <div id="reelLineRows" class="line-editor-rows"></div>
          <label class="full-span"><span>Notes</span><textarea id="reelNotes" rows="3" placeholder="Maintenance, handle side, best use"></textarea></label>
        </div>
        <div class="dialog-actions">
          <button class="button danger hidden" id="deleteReelButton" type="button">Delete</button>
          <div>
            <button class="button secondary" type="button" data-close-dialog>Cancel</button>
            <button class="button primary" type="submit">Save Reel</button>
          </div>
        </div>
      </form>
    </dialog>

          <button class="button primary" type="submit">Save Rod</button>
        </div>
      </form>
    </dialog>
